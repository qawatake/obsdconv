on:
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - 'sample/**'
      - 'scan/testdata/**'
      - 'convert/testdata/**'
      - 'process/testdata/**'
      - '**.go'
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - 'sample/**'
      - 'scan/testdata/**'
      - 'convert/testdata/**'
      - 'process/testdata/**'
      - '**.go'
  workflow_dispatch:
name: test
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: false # go.sum is not committed (see .gitignore)
    - name: Run tests
      run: |
        go mod tidy
        go test -v ./...
