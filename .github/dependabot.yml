version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Tokyo
    # github-actions does not support per-semver cooldown (semver-*-days are ignored and
    # Dependabot silently falls back to its 3-day default), so use a flat cooldown.
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Tokyo
    # Cooldown applies to version updates only; security updates skip it. A security alert
    # can still end up without a PR (e.g. when the fix needs a parent module bumped), and that
    # failure is silent, so check for alerts that have no matching PR instead of waiting.
    #
    # Days are chosen by the bump type from the *installed* version to the candidate, so from
    # 1.2.0 both 1.3.0 and 1.3.1 count as minor. A longer minor cooldown therefore never picks
    # the patched 1.3.1 over 1.3.0; it only delays 1.3.0. Keep patch and minor at 7 days and
    # delay majors only, to leave time to plan the migration.
    #
    # No groups: every module here ends up in what users build or run, so each update gets
    # its own PR and can be reviewed and reverted on its own.
    cooldown:
      default-days: 7
      semver-major-days: 30
